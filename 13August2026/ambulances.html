<!DOCTYPE html>
<html>
<head>
    <title>Ambulance List</title>
    <style>
        table {
            width: 80%;
            border-collapse: collapse;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid #333;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #e74c3c;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h2 style="text-align: center;">Ambulance List</h2>
    <table>
        <tr>
            <th>ID</th>
            <th>Vehicle Number</th>
            <th>Driver Name</th>
            <th>Type</th>
            <th>Status</th>
        </tr>

    </table>
</body>
</html>
